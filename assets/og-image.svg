<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)" />
  
  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Developer Icon Emblem -->
  <g transform="translate(100, 100)">
    <rect width="84" height="84" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M30 32L20 42L30 52" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M54 32L64 42L54 52" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M47 26L37 58" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="100" y="260" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="52" fill="url(#textGrad)">[Your Name]</text>
  <text x="100" y="330" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="34" fill="#f8fafc">Software Engineer Portfolio</text>
  <text x="100" y="390" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="24" fill="#94a3b8">Systems &bull; Web Applications &bull; Architecture &bull; Problem Solving</text>

  <!-- Badge Pill -->
  <rect x="100" y="450" width="320" height="48" rx="24" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <circle cx="125" cy="474" r="6" fill="#10b981" />
  <text x="142" y="482" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="18" fill="#e2e8f0">Open to Opportunities</text>
</svg>
